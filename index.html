<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM</title>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState } = React;

const PIN = “1234”;
const AZUL = “#185FA5”;

// ── HELPERS ──────────────────────────────────────────────────────────────────
function uid() { return Date.now() + Math.random().toString(36).slice(2); }
function hoy() { return new Date().toISOString().slice(0, 10); }
function mes0() { return new Date().toISOString().slice(0, 7); }
function $c(n) { return ‘$’ + parseFloat(n || 0).toLocaleString(‘es-AR’, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function useData() {
const [data, setData] = useState(() => {
try {
const s = localStorage.getItem(‘dep_v2’);
return s ? JSON.parse(s) : base();
} catch { return base(); }
});
function base() { return { tar: { mps:0,mpf:0,pts:0,ptf:0,mi:0,me:0,cam:0,pin:PIN }, mp:[], pt:[], clientes:[], movCli:[] }; }
function save(next) { setData(next); try { localStorage.setItem(‘dep_v2’, JSON.stringify(next)); } catch {} }
return [data, save];
}

// ── ESTILOS GLOBALES ─────────────────────────────────────────────────────────
const css = `*{box-sizing:border-box;margin:0;padding:0} body{font-family:'Segoe UI',system-ui,sans-serif;background:#F4F4F0;min-height:100vh}`;

// ── COMPONENTES BASE ─────────────────────────────────────────────────────────
// IMPORTANTE: definidos FUERA de cualquier componente para evitar re-renders

function Fg({ label, children }) {
return (
<div style={{ marginBottom: 14 }}>
<label style={{ display:‘block’, fontSize:12, color:’#666’, marginBottom:4, fontWeight:500 }}>{label}</label>
{children}
</div>
);
}

function G2({ children }) {
return <div style={{ display:‘grid’, gridTemplateColumns:‘1fr 1fr’, gap:12 }}>{children}</div>;
}

function Inp({ value, onChange, type=‘text’, placeholder=’’, min, style={} }) {
return (
<input
value={value}
onChange={onChange}
type={type}
placeholder={placeholder}
min={min}
style={{ width:‘100%’, padding:‘10px 12px’, border:‘1.5px solid #ddd’, borderRadius:8, fontSize:14, color:’#111’, background:’#fff’, outline:‘none’, …style }}
/>
);
}

function Card({ title, children }) {
return (
<div style={{ background:’#fff’, border:‘1px solid #e5e5e5’, borderRadius:10, padding:‘14px 16px’, marginBottom:12 }}>
{title && <div style={{ fontSize:13, fontWeight:600, marginBottom:10, paddingBottom:8, borderBottom:‘1px solid #eee’ }}>{title}</div>}
{children}
</div>
);
}

function Rr({ label, val, grand }) {
return (
<div style={{ display:‘flex’, justifyContent:‘space-between’, padding:‘6px 0’, fontSize: grand?15:13, fontWeight: grand?700:400, borderTop: grand?‘2px solid #ddd’:‘none’, marginTop: grand?6:0, borderBottom: grand?‘none’:‘1px solid #eee’ }}>
<span>{label}</span><span>{val}</span>
</div>
);
}

function BtnOpcion({ ico, tit, sub, onClick }) {
return (
<button onClick={onClick} style={{ padding:‘20px 12px’, borderRadius:12, border:‘2px solid #e0e0e0’, background:’#fff’, display:‘flex’, flexDirection:‘column’, alignItems:‘center’, gap:8, cursor:‘pointer’, textAlign:‘center’, width:‘100%’ }}>
<span style={{ fontSize:36 }}>{ico}</span>
<div style={{ fontSize:15, fontWeight:700, color:’#111’ }}>{tit}</div>
{sub && <div style={{ fontSize:12, color:’#888’ }}>{sub}</div>}
</button>
);
}

// ── PANTALLA INICIO ──────────────────────────────────────────────────────────
function Inicio({ onOperario, onAdmin }) {
return (
<div style={{ minHeight:‘100vh’, display:‘flex’, flexDirection:‘column’, alignItems:‘center’, justifyContent:‘center’, padding:24, gap:20, background:’#F4F4F0’ }}>
<div style={{ width:64, height:64, background:AZUL, borderRadius:16, display:‘flex’, alignItems:‘center’, justifyContent:‘center’, color:’#fff’, fontSize:22, fontWeight:700 }}>MM</div>
<div style={{ textAlign:‘center’ }}>
<div style={{ fontSize:22, fontWeight:700 }}>MM</div>
<div style={{ fontSize:13, color:’#888’, marginTop:4 }}>¿Cómo vas a usar la app hoy?</div>
</div>
{[
{ ico:‘👷’, tit:‘Operario’, sub:‘Registrar ingresos y egresos’, fn:onOperario, bg:’#E6F1FB’ },
{ ico:‘📊’, tit:‘Administrador’, sub:‘Ver reportes, stock y tarifas’, fn:onAdmin, bg:’#E8F5E9’ }
].map(b => (
<button key={b.tit} onClick={b.fn} style={{ width:‘100%’, maxWidth:340, padding:18, borderRadius:12, border:‘2px solid #e0e0e0’, background:’#fff’, display:‘flex’, alignItems:‘center’, gap:14, cursor:‘pointer’, textAlign:‘left’ }}>
<div style={{ width:44, height:44, borderRadius:10, background:b.bg, display:‘flex’, alignItems:‘center’, justifyContent:‘center’, fontSize:24, flexShrink:0 }}>{b.ico}</div>
<div>
<div style={{ fontSize:16, fontWeight:700 }}>{b.tit}</div>
<div style={{ fontSize:12, color:’#888’, marginTop:2 }}>{b.sub}</div>
</div>
</button>
))}
</div>
);
}

// ── PIN ──────────────────────────────────────────────────────────────────────
function PinScreen({ pinCorrecto, onOk, onVolver }) {
const [pin, setPin] = useState(’’);
const [err, setErr] = useState(false);
function check(v) {
setPin(v);
if (v.length >= 4 && v === String(pinCorrecto || PIN)) { onOk(); }
else if (v.length >= 4) { setErr(true); setPin(’’); }
}
return (
<div style={{ minHeight:‘100vh’, display:‘flex’, flexDirection:‘column’, alignItems:‘center’, justifyContent:‘center’, gap:16, padding:24, background:’#F4F4F0’ }}>
<div style={{ fontSize:48 }}>🔐</div>
<div style={{ fontSize:18, fontWeight:700 }}>Acceso Administrador</div>
<div style={{ fontSize:13, color:’#888’ }}>Ingresá tu PIN</div>
<Inp value={pin} onChange={e => check(e.target.value)} type=“password” placeholder=”••••” style={{ fontSize:28, letterSpacing:12, textAlign:‘center’, width:180, padding:12, border:‘2px solid #ddd’, borderRadius:10 }} />
{err && <div style={{ color:’#c62828’, fontSize:13 }}>PIN incorrecto</div>}
<span onClick={onVolver} style={{ fontSize:13, color:’#888’, cursor:‘pointer’, textDecoration:‘underline’ }}>← Volver</span>
</div>
);
}

// ── MODO OPERARIO ─────────────────────────────────────────────────────────────
function Operario({ data, save, onVolver }) {
const [paso, setPaso] = useState(0);
const [op, setOp] = useState({ cliente:‘arcor’, clienteNom:‘Arcor’, operacion:null, mercaderia:null, tipo:null });
const [exito, setExito] = useState(null);

function reset() { setPaso(0); setOp({ cliente:‘arcor’, clienteNom:‘Arcor’, operacion:null, mercaderia:null, tipo:null }); setExito(null); }
function volver() { if (paso === 0) { onVolver(); return; } setPaso(p => p-1); }

const titulos = [‘Nueva operación’, op.operacion===‘ingreso’?‘Ingreso’:‘Egreso’, op.mercaderia===‘mp’?‘Materia Prima’:‘Prod. Terminado’, ‘Seco o Frío’, ‘Formulario’];

if (exito) return (
<div style={{ minHeight:‘100vh’, background:’#F4F4F0’ }}>
<div style={{ background:AZUL, padding:‘14px 18px’, display:‘flex’, alignItems:‘center’ }}>
<div style={{ color:’#fff’, fontSize:15, fontWeight:600 }}>¡Listo!</div>
</div>
<div style={{ padding:40, textAlign:‘center’ }}>
<div style={{ fontSize:60, marginBottom:16 }}>✅</div>
<div style={{ fontSize:20, fontWeight:700, marginBottom:8 }}>¡Registrado!</div>
<div style={{ fontSize:13, color:’#888’, marginBottom:28 }}>{exito}</div>
<button onClick={reset} style={{ padding:‘12px 28px’, borderRadius:10, border:‘none’, background:AZUL, color:’#fff’, fontSize:15, fontWeight:600, cursor:‘pointer’ }}>+ Nueva operación</button>
</div>
</div>
);

let contenido = null;

if (paso === 0) {
contenido = (
<div>
<div style={{ fontSize:18, fontWeight:700, marginBottom:6 }}>¿Qué operación?</div>
<div style={{ fontSize:13, color:’#888’, marginBottom:20 }}>¿Entra o sale mercadería?</div>
<div style={{ display:‘grid’, gridTemplateColumns:‘1fr 1fr’, gap:12, marginBottom:20 }}>
<BtnOpcion ico=“📥” tit=“Ingreso” sub=“Entra al depósito” onClick={() => { setOp(o=>({…o,operacion:‘ingreso’})); setPaso(1); }} />
<BtnOpcion ico=“📤” tit=“Egreso” sub=“Sale del depósito” onClick={() => { setOp(o=>({…o,operacion:‘egreso’})); setPaso(1); }} />
</div>
{data.clientes.length > 0 && (
<div>
<div style={{ fontSize:12, color:’#888’, marginBottom:8, fontWeight:500 }}>CLIENTE</div>
<div style={{ display:‘flex’, gap:8, flexWrap:‘wrap’ }}>
{[{id:‘arcor’,nom:‘Arcor’,ico:‘🌽’}, …data.clientes.map(c=>({id:c._id,nom:c.nom,ico:‘🏭’}))].map(c => (
<button key={c.id} onClick={() => setOp(o=>({…o,cliente:c.id,clienteNom:c.nom}))}
style={{ padding:‘6px 14px’, borderRadius:20, border:`2px solid ${op.cliente===c.id?AZUL:'#ddd'}`, background:op.cliente===c.id?’#E6F1FB’:’#fff’, fontSize:13, fontWeight:600, cursor:‘pointer’, color:op.cliente===c.id?AZUL:’#555’ }}>
{c.ico} {c.nom}
</button>
))}
</div>
</div>
)}
</div>
);
} else if (paso === 1) {
if (op.cliente !== ‘arcor’) {
contenido = <Formulario op={op} data={data} save={save} onExito={setExito} />;
} else {
contenido = (
<div>
<div style={{ fontSize:18, fontWeight:700, marginBottom:6 }}>¿Qué mercadería?</div>
<div style={{ fontSize:13, color:’#888’, marginBottom:20 }}>Seleccioná la categoría</div>
<div style={{ display:‘grid’, gridTemplateColumns:‘1fr 1fr’, gap:12 }}>
<BtnOpcion ico=“📦” tit=“Materia Prima” sub=“MP Seca o Fría” onClick={() => { setOp(o=>({…o,mercaderia:‘mp’})); setPaso(2); }} />
<BtnOpcion ico=“📬” tit=“Prod. Terminado” sub=“PT Seco o Frío” onClick={() => { setOp(o=>({…o,mercaderia:‘pt’})); setPaso(2); }} />
</div>
</div>
);
}
} else if (paso === 2) {
contenido = (
<div>
<div style={{ fontSize:18, fontWeight:700, marginBottom:6 }}>¿Seco o Frío?</div>
<div style={{ fontSize:13, color:’#888’, marginBottom:20 }}>Tipo de almacenaje</div>
<div style={{ display:‘grid’, gridTemplateColumns:‘1fr 1fr’, gap:12 }}>
<BtnOpcion ico=“☀️” tit=“Seco” onClick={() => { setOp(o=>({…o,tipo:o.mercaderia+’-seco’})); setPaso(3); }} />
<BtnOpcion ico=“❄️” tit=“Frío” onClick={() => { setOp(o=>({…o,tipo:o.mercaderia+’-frio’})); setPaso(3); }} />
</div>
</div>
);
} else if (paso === 3) {
contenido = <Formulario op={op} data={data} save={save} onExito={setExito} />;
}

return (
<div style={{ minHeight:‘100vh’, background:’#F4F4F0’, display:‘flex’, flexDirection:‘column’ }}>
<div style={{ background:AZUL, padding:‘14px 18px’, display:‘flex’, alignItems:‘center’, gap:12, position:‘sticky’, top:0, zIndex:50 }}>
<button onClick={volver} style={{ width:32, height:32, borderRadius:8, border:‘none’, background:‘rgba(255,255,255,.2)’, color:’#fff’, fontSize:16, cursor:‘pointer’ }}>←</button>
<div style={{ color:’#fff’, fontSize:15, fontWeight:600, flex:1 }}>{titulos[paso] || ‘Formulario’}</div>
{paso > 0 && <div style={{ color:‘rgba(255,255,255,.7)’, fontSize:12 }}>Paso {paso} de {op.cliente!==‘arcor’?2:3}</div>}
</div>
<div style={{ flex:1, padding:20, maxWidth:500, margin:‘0 auto’, width:‘100%’ }}>
{contenido}
</div>
</div>
);
}

// ── FORMULARIO OPERARIO ───────────────────────────────────────────────────────
function Formulario({ op, data, save, onExito }) {
const { cliente, clienteNom, operacion, tipo } = op;
const esFrio = tipo?.includes(‘frio’);
const tipoMer = esFrio ? ‘frio’ : ‘seco’;
const esMp = tipo?.startsWith(‘mp’);
const esPt = tipo?.startsWith(‘pt’);
const esCli = cliente !== ‘arcor’;

const [oc, setOc] = useState(’’);
const [fi, setFi] = useState(hoy());
const [fe, setFe] = useState(hoy());
const [prod, setProd] = useState(’’);
const [lotes, setLotes] = useState([{ nom:’’, cod:’’ }]);
const [zona, setZona] = useState(’’);
const [fila, setFila] = useState(’’);
const [pal, setPal] = useState(’’);
const [rem, setRem] = useState(’’);
const [tra, setTra] = useState(’’);
const [rs, setRs] = useState(’’);
const [oe, setOe] = useState(’’);
const [ocEg, setOcEg] = useState(’’);
const [lotesSelec, setLotesSelec] = useState([]);
const [desc, setDesc] = useState(’’);
const [err, setErr] = useState(’’);
const [escanLoading, setEscanLoading] = useState(false);

const hD = new Date(hoy());
const stPT = (t) => Math.max(0, (data.pt||[]).filter(mv=>mv.tipo===t&&new Date(mv.fecha)<=hD).reduce((s,mv)=>s+(mv.dir===‘in’?mv.pal:-mv.pal),0));
const stCli = () => Math.max(0, (data.movCli||[]).filter(m=>m.clienteId===cliente).reduce((s,m)=>s+(m.dir===‘in’?m.pal:-m.pal),0));
const ocDisp = […new Set((data.mp||[]).filter(r=>r.tipo===tipoMer&&!r.fe).map(r=>r.oc))].sort();
const lotesOC = (data.mp||[]).filter(r=>r.oc===ocEg&&r.tipo===tipoMer&&!r.fe);

function addLote() { setLotes(l=>[…l,{nom:prod,cod:’’}]); }
function setLote(i,k,v) { setLotes(l=>{ const n=[…l]; n[i]={…n[i],[k]:v}; return n; }); }
function toggleLote(id) { setLotesSelec(s=>s.includes(id)?s.filter(x=>x!==id):[…s,id]); }

async function escanear(e, idx) {
const file = e.target.files[0]; if (!file) return;
setEscanLoading(true);
try {
const base64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(’,’)[1]); r.onerror=rej; r.readAsDataURL(file); });
const resp = await fetch(‘https://api.anthropic.com/v1/messages’,{method:‘POST’,headers:{‘Content-Type’:‘application/json’},body:JSON.stringify({model:‘claude-sonnet-4-20250514’,max_tokens:200,messages:[{role:‘user’,content:[{type:‘image’,source:{type:‘base64’,media_type:file.type||‘image/jpeg’,data:base64}},{type:‘text’,text:‘Foto de sticker de pallet. Extraé el LOTE y CÓDIGO. Respondé SOLO JSON: {“lote”:”…”,“codigo”:”…”} Sin nada más.’}]}]})});
const d = await resp.json();
const parsed = JSON.parse((d.content?.[0]?.text||’{}’).replace(/`json|`/g,’’).trim());
setLotes(l=>{ const n=[…l]; n[idx]={…n[idx],nom:parsed.lote||n[idx].nom,cod:parsed.codigo||n[idx].cod}; return n; });
} catch { alert(‘No pude leer el sticker. Cargalo a mano.’); }
finally { setEscanLoading(false); e.target.value=’’; }
}

setErr(’’);

// ── TAB RESUMEN ───────────────────────────────────────────────────────────────
function TabResumen({ data }) {
const mes = mes0();
const [y,m] = mes.split(’-’).map(Number);
const im = new Date(y,m-1,1), fm = new Date(y,m,0), hD = new Date(hoy());
const pref = mes;
const diasMes = new Date(y,m,0).getDate();

function calcMP(tipo) {
const tar = tipo===‘seco’?data.tar.mps:data.tar.mpf;
const tmi=data.tar.mi||0, tme=data.tar.me||0;
const regs=(data.mp||[]).filter(r=>r.tipo===tipo&&new Date(r.fi)<=fm&&(!r.fe||new Date(r.fe)>=im));
let tE=0,tMI=0,tMO=0;
regs.forEach(r=>{
const en=new Date(r.fi),sa=r.fe?new Date(r.fe):hD;
const de=en>im?en:im, ha=sa<hD?sa:hD;
const ds=de>ha?0:Math.ceil((ha-de)/86400000)+1;
tE+=ds*(tar||0); tMI+=tmi;
if(r.fe&&new Date(r.fe)>=im&&new Date(r.fe)<=fm) tMO+=tme;
});
return tE+tMI+tMO;
}

let ptTotal=0;
for(let d=1;d<=diasMes;d++){
const fd=y+’-’+String(m).padStart(2,‘0’)+’-’+String(d).padStart(2,‘0’);
const dD=new Date(fd); if(dD>new Date()) break;
const stS=(data.pt||[]).filter(mv=>mv.tipo===‘seco’&&new Date(mv.fecha)<=dD).reduce((s,mv)=>s+(mv.dir===‘in’?mv.pal:-mv.pal),0);
const stF=(data.pt||[]).filter(mv=>mv.tipo===‘frio’&&new Date(mv.fecha)<=dD).reduce((s,mv)=>s+(mv.dir===‘in’?mv.pal:-mv.pal),0);
ptTotal+=Math.max(0,stS)*(data.tar.pts||0)+Math.max(0,stF)*(data.tar.ptf||0);
const mH=(data.pt||[]).filter(mv=>mv.fecha===fd);
ptTotal+=mH.reduce((s,mv)=>s+mv.pal,0)*(data.tar.mi||0);
}

const cams=(data.pt||[]).filter(mv=>mv.dir===‘out’&&mv.fecha?.startsWith(pref));
const camTotal=cams.length*(data.tar.cam||0);
const arcorTotal=calcMP(‘seco’)+calcMP(‘frio’)+ptTotal+camTotal;

let cliTotal=0;
(data.clientes||[]).forEach(cli=>{
for(let d=1;d<=diasMes;d++){
const fd=y+’-’+String(m).padStart(2,‘0’)+’-’+String(d).padStart(2,‘0’);
const dD=new Date(fd); if(dD>new Date()) break;
const st=Math.max(0,(data.movCli||[]).filter(mv=>mv.clienteId===cli._id&&new Date(mv.fecha)<=dD).reduce((s,mv)=>s+(mv.dir===‘in’?mv.pal:-mv.pal),0));
cliTotal+=st*(cli.tarEst||0);
}
const movsM=(data.movCli||[]).filter(mv=>mv.clienteId===cli._id&&mv.fecha?.startsWith(pref));
cliTotal+=movsM.filter(mv=>mv.dir===‘in’).reduce((s,mv)=>s+mv.pal,0)*(cli.tarMI||0);
cliTotal+=movsM.filter(mv=>mv.dir===‘out’).reduce((s,mv)=>s+mv.pal,0)*(cli.tarME||0);
});

const granTotal=arcorTotal+cliTotal;
const stS=Math.max(0,(data.pt||[]).filter(mv=>mv.tipo===‘seco’&&new Date(mv.fecha)<=hD).reduce((s,mv)=>s+(mv.dir===‘in’?mv.pal:-mv.pal),0));
const stF=Math.max(0,(data.pt||[]).filter(mv=>mv.tipo===‘frio’&&new Date(mv.fecha)<=hD).reduce((s,mv)=>s+(mv.dir===‘in’?mv.pal:-mv.pal),0));
const mpActivos=(data.mp||[]).filter(r=>!r.fe).length;

return (
<div>
<div style={{ background:‘linear-gradient(135deg,#185FA5,#0C447C)’, borderRadius:12, padding:18, marginBottom:14, color:’#fff’ }}>
<div style={{ fontSize:13, opacity:.85, marginBottom:12 }}>🏢 Total del depósito — {mes}</div>
<div style={{ fontSize:28, fontWeight:700, marginBottom:3 }}>{$c(granTotal)}</div>
<div style={{ fontSize:11, opacity:.7, marginBottom:14 }}>Suma de todos los clientes</div>
<div style={{ display:‘grid’, gridTemplateColumns:‘1fr 1fr’, gap:8 }}>
{[[‘Arcor’,arcorTotal],[‘Otros clientes’,cliTotal]].map(([l,v])=>(
<div key={l} style={{ background:‘rgba(255,255,255,.15)’, borderRadius:8, padding:‘9px 11px’ }}>
<div style={{ fontSize:11, opacity:.8 }}>{l}</div>
<div style={{ fontSize:15, fontWeight:600 }}>{$c(v)}</div>
</div>
))}
</div>
</div>
<div style={{ display:‘grid’, gridTemplateColumns:‘repeat(2,1fr)’, gap:10, marginBottom:14 }}>
{[[‘Lotes MP activos’,mpActivos,‘lotes’],[‘PT Seco — stock’,stS,‘pallets’],[‘PT Frío — stock’,stF,‘pallets’],[‘Camiones mes’,cams.length,‘cargas’]].map(([l,v,s])=>(
<div key={l} style={{ background:’#F8F8F6’, borderRadius:8, padding:‘12px 14px’, border:‘1px solid #eee’ }}>
<div style={{ fontSize:11, color:’#888’, marginBottom:4, textTransform:‘uppercase’, letterSpacing:.3 }}>{l}</div>
<div style={{ fontSize:20, fontWeight:600 }}>{v}</div>
<div style={{ fontSize:11, color:’#aaa’ }}>{s}</div>
</div>
))}
</div>
<Card title="🌽 Arcor">
<Rr label=“MP Seca” val={$c(calcMP(‘seco’))} />
<Rr label=“MP Fría” val={$c(calcMP(‘frio’))} />
<Rr label="Prod. Terminados" val={$c(ptTotal)} />
<Rr label="Camiones" val={$c(camTotal)} />
<Rr label="Total Arcor" val={$c(arcorTotal)} grand />
</Card>
{(data.clientes||[]).length>0 && (
<Card title="🏭 Otros clientes">
{(data.clientes||[]).map(c=>{
let tot=0;
for(let d=1;d<=diasMes;d++){
const fd=y+’-’+String(m).padStart(2,‘0’)+’-’+String(d).padStart(2,‘0’);
const dD=new Date(fd); if(dD>new Date()) break;
const st=Math.max(0,(data.movCli||[]).filter(mv=>mv.clienteId===c._id&&new Date(mv.fecha)<=dD).reduce((s,mv)=>s+(mv.dir===‘in’?mv.pal:-mv.pal),0));

tot+=movsM.filter(mv=>mv.dir===‘in’).reduce((s,mv)=>s+mv.pal,0)*(c.tarMI||0);
tot+=movsM.filter(mv=>mv.dir===‘out’).reduce((s,mv)=>s+mv.pal,0)*(c.tarME||0);
return <Rr key={c._id} label={`🏭 ${c.nom}`} val={$c(tot)} />;
})}
<Rr label="Total otros clientes" val={$c(cliTotal)} grand />
</Card>
)}
<div style={{ background:’#111’, borderRadius:10, padding:‘14px 18px’, display:‘flex’, justifyContent:‘space-between’, alignItems:‘center’ }}>
<span style={{ color:’#fff’, fontSize:13, fontWeight:600 }}>💰 Total a facturar</span>
<span style={{ color:’#4CAF50’, fontSize:20, fontWeight:700 }}>{$c(granTotal)}</span>
</div>
</div>
);
}

const fe=prompt(‘Fecha de egreso (AAAA-MM-DD):’,hoy()); if(!fe) return;
save({…data,mp:data.mp.map(r=>r._id===id?{…r,fe,movs:[…(r.movs||[]),{fe}]}:r)});

// ── TAB TARIFAS ───────────────────────────────────────────────────────────────
function TabTarifas({ data, save }) {
// Usar estado separado por campo para evitar re-renders que cierran el teclado
const [mps, setMps] = useState(String(data.tar.mps||’’));
const [mpf, setMpf] = useState(String(data.tar.mpf||’’));
const [pts, setPts] = useState(String(data.tar.pts||’’));
const [ptf, setPtf] = useState(String(data.tar.ptf||’’));
const [mi, setMi] = useState(String(data.tar.mi||’’));
const [me, setMe] = useState(String(data.tar.me||’’));
const [cam, setCam] = useState(String(data.tar.cam||’’));
const [nuevoPin, setNuevoPin] = useState(’’);
const [ok, setOk] = useState(false);

// Gestión de clientes
const [nomCli, setNomCli] = useState(’’);
const [descCli, setDescCli] = useState(’’);
const [tarEstCli, setTarEstCli] = useState(’’);
const [tarMiCli, setTarMiCli] = useState(’’);
const [tarMeCli, setTarMeCli] = useState(’’);
const [editCliId, setEditCliId] = useState(null);

function guardar() {
const pin = nuevoPin ? (nuevoPin.length<4||isNaN(nuevoPin)?null:nuevoPin) : (data.tar.pin||PIN);
if (nuevoPin && !pin) { alert(‘PIN 4-6 dígitos’); return; }
const tar = { mps:parseFloat(mps)||0, mpf:parseFloat(mpf)||0, pts:parseFloat(pts)||0, ptf:parseFloat(ptf)||0, mi:parseFloat(mi)||0, me:parseFloat(me)||0, cam:parseFloat(cam)||0, pin };
save({…data, tar});
setOk(true); setTimeout(()=>setOk(false),2500);
}

function abrirEditCli(c) {
setEditCliId(c._id); setNomCli(c.nom||’’); setDescCli(c.desc||’’);
setTarEstCli(String(c.tarEst||’’)); setTarMiCli(String(c.tarMI||’’)); setTarMeCli(String(c.tarME||’’));
}
function limpiarCli() { setEditCliId(null); setNomCli(’’); setDescCli(’’); setTarEstCli(’’); setTarMiCli(’’); setTarMeCli(’’); }

function guardarCli() {
if (!nomCli.trim()) { alert(‘Ingresá el nombre’); return; }
const c = { nom:nomCli.trim(), desc:descCli.trim(), tarEst:parseFloat(tarEstCli)||0, tarMI:parseFloat(tarMiCli)||0, tarME:parseFloat(tarMeCli)||0 };
if (editCliId) {
save({…data, clientes:data.clientes.map(x=>x._id===editCliId?{…x,…c}:x)});
} else {
save({…data, clientes:[…data.clientes,{_id:uid(),…c}]});
}
limpiarCli();
}
function eliminarCli(id) { if(confirm(’¿Eliminar este cliente?’)) save({…data,clientes:data.clientes.filter(x=>x._id!==id)}); }

return (
<div>
<Card title="📊 Estadía Arcor — tarifa diaria ($)">
<G2>
<Fg label="MP Seca / lote"><Inp value={mps} onChange={e=>setMps(e.target.value)} type=“number” placeholder=“0.00” /></Fg>
<Fg label="MP Fría / lote"><Inp value={mpf} onChange={e=>setMpf(e.target.value)} type=“number” placeholder=“0.00” /></Fg>
</G2>
<G2>
<Fg label="PT Seco / pallet"><Inp value={pts} onChange={e=>setPts(e.target.value)} type=“number” placeholder=“0.00” /></Fg>
<Fg label="PT Frío / pallet"><Inp value={ptf} onChange={e=>setPtf(e.target.value)} type=“number” placeholder=“0.00” /></Fg>
</G2>
</Card>
<Card title="🔄 Movimientos Arcor — tarifa por pallet ($)">
<G2>
<Fg label="Ingreso"><Inp value={mi} onChange={e=>setMi(e.target.value)} type=“number” placeholder=“0.00” /></Fg>
<Fg label="Egreso"><Inp value={me} onChange={e=>setMe(e.target.value)} type=“number” placeholder=“0.00” /></Fg>
</G2>
</Card>
<Card title="🚛 Tarifa por camión PT">
<Fg label="Por camión cargado"><Inp value={cam} onChange={e=>setCam(e.target.value)} type=“number” placeholder=“0.00” /></Fg>
</Card>
<Card title="🔐 PIN de administrador">
<Fg label="Nuevo PIN (vacío = no cambia)"><Inp value={nuevoPin} onChange={e=>setNuevoPin(e.target.value)} type=“password” placeholder=”••••” /></Fg>
</Card>
<button onClick={guardar} style={{ width:‘100%’, padding:14, borderRadius:10, border:‘none’, background:AZUL, color:’#fff’, fontSize:16, fontWeight:700, cursor:‘pointer’ }}>Guardar tarifas Arcor</button>
{ok && <div style={{ color:’#2E7D32’, textAlign:‘center’, marginTop:8, fontSize:13 }}>✓ Guardado</div>}

```
{/* GESTIÓN DE CLIENTES */}
<div style={{ marginTop:20 }}>
<Card title="🏭 Clientes">
{(data.clientes||[]).length===0 && <div style={{ color:'#bbb',fontSize:13,marginBottom:12 }}>Sin clientes agregados</div>}
{(data.clientes||[]).map(c=>(
<div key={c._id} style={{ background:'#F8F8F6',borderRadius:8,padding:'10px 14px',marginBottom:8,border:'1px solid #eee' }}>
<div style={{ display:'flex',justifyContent:'space-between',alignItems:'flex-start' }}>
<div>
<div style={{ fontWeight:600,fontSize:13 }}>🏭 {c.nom}</div>
{c.desc && <div style={{ fontSize:12,color:'#888' }}>{c.desc}</div>}
<div style={{ fontSize:11,color:'#888',marginTop:3 }}>Est: ${c.tarEst||0}/p/día · Mov: ${c.tarMI||0} in / ${c.tarME||0} out</div>
</div>
<div style={{ display:'flex',gap:6 }}>
<button onClick={()=>abrirEditCli(c)} style={{ padding:'5px 10px',borderRadius:6,border:'1px solid #ddd',background:'#fff',fontSize:12,cursor:'pointer' }}>✏️</button>
<button onClick={()=>eliminarCli(c._id)} style={{ padding:'5px 10px',borderRadius:6,border:'1px solid #ffcdd2',background:'#fff',color:'#c62828',fontSize:12,cursor:'pointer' }}>🗑️</button>
</div>
</div>
</div>
))}

{/* Formulario nuevo/editar cliente */}
<div style={{ background:'#F0F4F9',borderRadius:8,padding:14,border:'1px solid #B5D4F4',marginTop:8 }}>
<div style={{ fontSize:12,fontWeight:600,color:AZUL,marginBottom:10 }}>{editCliId?'✏️ Editar cliente':'➕ Nuevo cliente'}</div>
<G2>
<Fg label="Nombre *"><Inp value={nomCli} onChange={e=>setNomCli(e.target.value)} placeholder="Ej: Netafim" /></Fg>
<Fg label="Descripción"><Inp value={descCli} onChange={e=>setDescCli(e.target.value)} placeholder="Ej: Mangueras" /></Fg>
</G2>
<div style={{ fontSize:11,color:'#666',fontWeight:600,marginBottom:8,textTransform:'uppercase' }}>Tarifas ($)</div>
<G2>
<Fg label="Estadía / pallet / día"><Inp value={tarEstCli} onChange={e=>setTarEstCli(e.target.value)} type="number" placeholder="0.00" /></Fg>
<Fg label="Mov. ingreso / pallet"><Inp value={tarMiCli} onChange={e=>setTarMiCli(e.target.value)} type="number" placeholder="0.00" /></Fg>
</G2>
<Fg label="Mov. egreso / pallet"><Inp value={tarMeCli} onChange={e=>setTarMeCli(e.target.value)} type="number" placeholder="0.00" /></Fg>
<div style={{ display:'flex',gap:8 }}>
<button onClick={guardarCli} style={{ flex:1,padding:12,borderRadius:8,border:'none',background:AZUL,color:'#fff',fontSize:14,fontWeight:600,cursor:'pointer' }}>
{editCliId?'Guardar cambios':'Agregar cliente'}
</button>
{editCliId && <button onClick={limpiarCli} style={{ padding:12,borderRadius:8,border:'1px solid #ddd',background:'#fff',fontSize:14,cursor:'pointer' }}>Cancelar</button>}
</div>
</div>
</Card>
</div>
</div>
```

);
}
