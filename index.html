<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MM - Deposito</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F4F4F0;min-height:100vh;font-size:14px}
input,select,button{font-family:Arial,sans-serif;font-size:14px}
input,select{width:100%;padding:10px 12px;border:1.5px solid #ccc;border-radius:8px;color:#111;background:#fff;outline:none}
input:focus,select:focus{border-color:#185FA5}
.btn{padding:10px 16px;border-radius:8px;border:1.5px solid #ccc;background:#fff;color:#333;cursor:pointer;font-weight:500}
.btnp{background:#185FA5;color:#fff;border-color:#185FA5}
.btnr{color:#c62828;border-color:#ffcdd2}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.tit{font-size:13px;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #eee}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;color:#666;margin-bottom:4px;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hdr{background:#185FA5;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.htit{color:#fff;font-size:15px;font-weight:700;flex:1}
.back{width:34px;height:34px;border-radius:8px;border:none;background:rgba(255,255,255,0.2);color:#fff;font-size:18px;cursor:pointer}
.bdy{padding:16px;max-width:500px;margin:0 auto}
.opbtn{padding:18px 12px;border-radius:12px;border:2px solid #ddd;background:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center;width:100%}
.opbtn:active{border-color:#185FA5;background:#EEF4FF}
.rr{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #eee}
.rr:last-child{border-bottom:none}
.rrgrand{font-weight:700;font-size:14px;border-top:2px solid #ddd;border-bottom:none;padding-top:8px;margin-top:4px}
.nav{display:flex;gap:4px;padding:8px 14px;background:#fff;border-bottom:1px solid #ddd;overflow-x:auto}
.ntab{padding:5px 12px;border-radius:7px;border:1px solid #ddd;background:transparent;color:#555;font-size:12px;cursor:pointer;white-space:nowrap}
.ntab.on{background:#185FA5;color:#fff;border-color:#185FA5}
.firma{position:fixed;bottom:12px;right:14px;font-size:13px;color:#185FA5;z-index:9999;pointer-events:none;font-style:italic;font-weight:700;background:rgba(255,255,255,0.92);padding:4px 10px;border-radius:20px}
.mcard{background:#F8F8F6;border-radius:8px;padding:12px 14px;margin-bottom:8px;border:1px solid #eee}
.min{background:#E8F5E9}
.mout{background:#FFEBEE}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;margin-bottom:6px}
.empty{text-align:center;padding:24px;color:#bbb;font-size:13px}
.errbox{background:#FFEBEE;color:#c62828;border-radius:7px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.infobox{background:#EEF4FF;border:1px solid #B5D4F4;border-radius:8px;padding:10px 13px;margin-bottom:14px;font-size:13px}
.loterow{display:grid;grid-template-columns:1fr 1fr auto auto;gap:6px;margin-bottom:8px;align-items:center}
.linp{padding:8px 10px;border:1.5px solid #ccc;border-radius:6px;font-size:13px;width:100%}
.camb{display:flex;align-items:center;justify-content:center;width:36px;height:38px;border:1.5px solid #185FA5;border-radius:6px;background:#EEF4FF;cursor:pointer;flex-shrink:0;font-size:18px}
.delb{width:32px;height:38px;border:1px solid #ffcdd2;background:#fff;color:#c62828;border-radius:6px;cursor:pointer;flex-shrink:0}
.chip{padding:6px 14px;border-radius:20px;border:2px solid #ddd;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#555}
.chip.on{border-color:#185FA5;background:#EEF4FF;color:#185FA5}
.metgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.met{background:#F8F8F6;border-radius:8px;padding:12px 14px;border:1px solid #eee}
.adh{background:#fff;border-bottom:1px solid #ddd;padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.indgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.indcard{background:#fff;border-radius:10px;padding:14px;border:1px solid #ddd;text-align:center}
.indlbl{font-size:11px;color:#888;text-transform:uppercase;margin-bottom:6px}
.indval{font-size:22px;font-weight:700;margin-bottom:4px}
.bar{background:#eee;border-radius:99px;height:8px;margin:4px 0}
.bfill{height:8px;border-radius:99px}
.pla{overflow-x:auto}
.platbl{border-collapse:collapse;font-size:11px;min-width:600px}
.platbl th,.platbl td{border:1px solid #ddd;padding:4px 6px;white-space:nowrap}
.platbl th{background:#EEF4FF;font-weight:700;text-align:center}
.plalote{background:#fff;text-align:left;min-width:120px;position:sticky;left:0;z-index:2;border-right:2px solid #B5D4F4}
.plaoc{background:#185FA5;color:#fff;font-weight:700;text-align:left}
.celok{background:#C8E6C9;text-align:center;color:#2E7D32;font-weight:700}
.celn{background:#F5F5F5;text-align:center;color:#ccc}
.celeg{background:#FFCDD2;text-align:center;color:#C62828;font-weight:700}
</style>
</head>
<body>
<div class="firma">&#169; Marcos Manchon</div>
<div id="app"></div>
<script>
var K = 'mm_v4';
function baseD() {
return {
tar: {mps:0,mpf:0,pts:0,ptf:0,mi:0,me:0,cam:0,pin:'1234'},
mp: [], pt: [], clientes: [], movCli: []
};
}
var D = (function() {
try {
var s = localStorage.getItem(K);
if (s) return JSON.parse(s);
return baseD();
} catch(e) { return baseD(); }
})();

function sv() {
try { localStorage.setItem(K, JSON.stringify(D)); } catch(e) {}
}
function uid() { return Date.now() + Math.random().toString(36).slice(2); }
function hoy() { return new Date().toISOString().slice(0,10); }
function mes0() { return new Date().toISOString().slice(0,7); }
function $c(n) {
return ‘$’ + parseFloat(n || 0).toLocaleString(‘es-AR’, {minimumFractionDigits:2, maximumFractionDigits:2});
}
function el(id) { return document.getElementById(id); }
function gv(id) { return el(id) ? el(id).value : ‘’; }
function sv2(id, v) { if (el(id)) el(id).value = v; }

function stPT(tipo) {
var hD = new Date(hoy());
var tot = 0;
var list = D.pt || [];
for (var i = 0; i < list.length; i++) {
var mv = list[i];
if (mv.tipo === tipo && new Date(mv.fecha) <= hD) {
tot += mv.dir === ‘in’ ? mv.pal : -mv.pal;
}
}
return Math.max(0, tot);
}

function stCli(cid) {
var tot = 0;
var list = D.movCli || [];
for (var i = 0; i < list.length; i++) {
var m = list[i];
if (m.clienteId === cid) tot += m.dir === ‘in’ ? m.pal : -m.pal;
}
return Math.max(0, tot);
}

var pantalla = ‘inicio’;
function ir(p) { pantalla = p; render(); }

function render() {
try {
var app = el(‘app’);
if (!app) return;
if (pantalla === ‘inicio’) app.innerHTML = htmlInicio();
else if (pantalla === ‘pin’) app.innerHTML = htmlPin();
else if (pantalla === ‘operario’) renderOperario();
else if (pantalla === ‘admin’) renderAdmin();
} catch(e) {
var app2 = el(‘app’);
if (app2) app2.innerHTML = ’<div style="padding:20px;color:red"><b>Error:</b> ’ + e.message + ‘</div>’;
}
}

// ===== INICIO =====
function htmlInicio() {
var cli = ‘’;
for (var i = 0; i < D.clientes.length; i++) {
var c = D.clientes[i];
cli += ‘<button onclick=“selOp('op_cli_'’ + “+’”+c._id+”’+’)” +
’ style=“width:100%;max-width:340px;padding:16px;border-radius:12px;border:2px solid #ddd;background:#fff;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;margin-bottom:12px”>’ +
‘<div style="width:44px;height:44px;border-radius:10px;background:#E8F5E9;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">🏭</div>’ +
‘<div><div style="font-size:16px;font-weight:700">’ + c.nom + ‘</div>’ +
‘<div style="font-size:12px;color:#888;margin-top:2px">’ + (c.desc || ‘Otro cliente’) + ‘</div></div></button>’;
}
return ‘<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px;background:#F4F4F0">’ +
‘<div style="width:64px;height:64px;background:#185FA5;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:700">MM</div>’ +
‘<div style="text-align:center"><div style="font-size:22px;font-weight:700">MM</div><div style="font-size:13px;color:#888;margin-top:4px">Gestion de deposito</div></div>’ +
‘<button onclick="ir(\'operario\')" style="width:100%;max-width:340px;padding:18px;border-radius:12px;border:2px solid #ddd;background:#fff;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left">’ +
‘<div style="width:44px;height:44px;border-radius:10px;background:#EEF4FF;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">👷</div>’ +
‘<div><div style="font-size:16px;font-weight:700">Operario</div><div style="font-size:12px;color:#888;margin-top:2px">Registrar ingresos y egresos</div></div></button>’ +
‘<button onclick="ir(\'pin\')" style="width:100%;max-width:340px;padding:18px;border-radius:12px;border:2px solid #ddd;background:#fff;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left">’ +
‘<div style="width:44px;height:44px;border-radius:10px;background:#E8F5E9;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">📊</div>’ +
‘<div><div style="font-size:16px;font-weight:700">Administrador</div><div style="font-size:12px;color:#888;margin-top:2px">Reportes, stock y tarifas</div></div></button>’ +
‘</div>’;
}

// ===== PIN =====
function htmlPin() {
return ‘<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#F4F4F0">’ +
‘<div style="font-size:48px">🔐</div>’ +
‘<div style="font-size:18px;font-weight:700">Acceso Administrador</div>’ +
‘<div style="font-size:13px;color:#888">Ingresa tu PIN</div>’ +
’<input id=“pin-inp” type=“password” inputmode=“numeric” maxlength=“6” placeholder=”****” oninput=“chkPin(this.value)” ’ +
‘style=“font-size:28px;letter-spacing:12px;text-align:center;width:180px;padding:12px;border:2px solid #ddd;border-radius:10px”>’ +
‘<div id="pin-err" style="color:#c62828;font-size:13px;display:none">PIN incorrecto</div>’ +
‘<span onclick="ir(\'inicio\')" style="font-size:13px;color:#888;cursor:pointer;text-decoration:underline">Volver</span></div>’;
}
function chkPin(v) {
var p = String(D.tar.pin || ‘1234’);
if (v.length >= p.length && v === p) { ir(‘admin’); }
else if (v.length >= 4) { if (el(‘pin-err’)) el(‘pin-err’).style.display = ‘block’; if (el(‘pin-inp’)) el(‘pin-inp’).value = ‘’; }
}

// ===== OPERARIO =====
var OP = {paso:0, cliente:‘arcor’, clienteNom:‘Arcor’, operacion:null, mercaderia:null, tipo:null, operario:’’};
var lotesOP = [{nom:’’,cod:’’}];
var lotesSelOP = [];

function resetOP() {
OP = {paso:0, cliente:‘arcor’, clienteNom:‘Arcor’, operacion:null, mercaderia:null, tipo:null, operario:’’};
lotesOP = [{nom:’’,cod:’’}];
lotesSelOP = [];
}

function renderOperario() {
var stepHtml = OP.paso > 0 ? ’<div style="color:rgba(255,255,255,0.7);font-size:12px">Paso ’ + OP.paso + ‘</div>’ : ‘’;
el(‘app’).innerHTML =
‘<div style="min-height:100vh;background:#F4F4F0;display:flex;flex-direction:column">’ +
‘<div class="hdr"><button class="back" onclick="opVolver()">←</button>’ +
‘<div class="htit" id="op-tit">Nueva operacion</div>’ + stepHtml + ‘</div>’ +
‘<div class="bdy" id="op-body"></div></div>’;
renderOpPaso();
}

function opVolver() {
if (OP.paso === 0) { ir(‘inicio’); return; }
OP.paso–;
if (OP.paso === 0) { OP.operacion = null; OP.mercaderia = null; OP.tipo = null; }
else if (OP.paso === 1) { OP.mercaderia = null; OP.tipo = null; }
else if (OP.paso === 2) { OP.tipo = null; }
renderOpPaso();
}

function stit(t) { if (el(‘op-tit’)) el(‘op-tit’).textContent = t; }

function renderOpPaso() {
var b = el(‘op-body’);
if (!b) return;
if (OP.paso === 0) {
stit(‘Nueva operacion’);
var chips = ’<button class="chip' + (OP.cliente === 'arcor' ? ' on' : '') + '" onclick="opCli(\'arcor\',\'Arcor\')">🌿 Arcor</button> ’;
for (var i = 0; i < D.clientes.length; i++) {
var c = D.clientes[i];
chips += ’<button class="chip' + (OP.cliente === c._id ? ' on' : '') + '" onclick="opCli(\'' + c._id + '\',\'' + c.nom.replace(/'/g,'') + '\')">🏭 ’ + c.nom + ’</button> ’;
}
b.innerHTML =
‘<div class="fg"><label>Tu nombre o legajo *</label><input id="op-nom" placeholder="Ej: Juan Perez" value="' + (OP.operario||'') + '"></div>’ +
‘<div style="font-size:18px;font-weight:700;margin-bottom:6px">Que operacion?</div>’ +
‘<div style="font-size:13px;color:#888;margin-bottom:16px">Entra o sale mercaderia?</div>’ +
‘<div class="g2" style="margin-bottom:20px">’ +
‘<button class="opbtn" onclick="opOp(\'ingreso\')"><span style="font-size:34px">📥</span><span style="font-size:15px;font-weight:700">Ingreso</span><span style="font-size:12px;color:#888">Entra al deposito</span></button>’ +
‘<button class="opbtn" onclick="opOp(\'egreso\')"><span style="font-size:34px">📤</span><span style="font-size:15px;font-weight:700">Egreso</span><span style="font-size:12px;color:#888">Sale del deposito</span></button>’ +
‘</div>’ +
(D.clientes.length > 0 ? ‘<div style="font-size:12px;color:#888;margin-bottom:8px;font-weight:600">CLIENTE</div><div style="display:flex;gap:8px;flex-wrap:wrap">’ + chips + ‘</div>’ : ‘’);
}
else if (OP.paso === 1) {
if (OP.cliente !== ‘arcor’) { OP.tipo = ‘cli’; renderFormOP(); return; }
stit(‘Que mercaderia?’);
b.innerHTML =
‘<div style="font-size:18px;font-weight:700;margin-bottom:6px">Que mercaderia?</div>’ +
‘<div style="font-size:13px;color:#888;margin-bottom:16px">Selecciona la categoria</div>’ +
‘<div class="g2">’ +
‘<button class="opbtn" onclick="opMer(\'mp\')"><span style="font-size:34px">📦</span><span style="font-size:15px;font-weight:700">Materia Prima</span><span style="font-size:12px;color:#888">Seca o Fria</span></button>’ +
‘<button class="opbtn" onclick="opMer(\'pt\')"><span style="font-size:34px">📬</span><span style="font-size:15px;font-weight:700">Prod. Terminado</span><span style="font-size:12px;color:#888">Seco o Frio</span></button>’ +
‘</div>’;
}
else if (OP.paso === 2) {
stit(‘Seco o Frio?’);
b.innerHTML =
‘<div style="font-size:18px;font-weight:700;margin-bottom:6px">Seco o Frio?</div>’ +
‘<div style="font-size:13px;color:#888;margin-bottom:16px">Tipo de almacenaje</div>’ +
‘<div class="g2">’ +
‘<button class="opbtn" onclick="opTipo(\'seco\')"><span style="font-size:34px">☀</span><span style="font-size:15px;font-weight:700">Seco</span></button>’ +
‘<button class="opbtn" onclick="opTipo(\'frio\')"><span style="font-size:34px">❄</span><span style="font-size:15px;font-weight:700">Frio</span></button>’ +
‘</div>’;
}
else if (OP.paso === 3) { renderFormOP(); }
}

function opOp(op) {
var nom = gv(‘op-nom’).trim();
if (!nom) { alert(‘Ingresa tu nombre antes de continuar’); if (el(‘op-nom’)) el(‘op-nom’).focus(); return; }
OP.operario = nom; OP.operacion = op; OP.paso = 1; renderOpPaso();
}
function opCli(id, nom) {
OP.cliente = id; OP.clienteNom = nom;
var chips = document.querySelectorAll(’.chip’);
for (var i = 0; i < chips.length; i++) chips[i].classList.remove(‘on’);
if (event && event.target) event.target.classList.add(‘on’);
}
function opMer(m) { OP.mercaderia = m; OP.paso = 2; renderOpPaso(); }
function opTipo(t) { OP.tipo = OP.mercaderia + ‘-’ + t; OP.paso = 3; renderOpPaso(); }

function renderFormOP() {
var b = el(‘op-body’);
if (!b) return;
var tipo = OP.tipo || ‘’;
var esMp = tipo.indexOf(‘mp’) === 0;
var esPt = tipo.indexOf(‘pt’) === 0;
var esCli = OP.cliente !== ‘arcor’;
var esFrio = tipo.indexOf(‘frio’) >= 0;
var tipoMer = esFrio ? ‘frio’ : ‘seco’;
var stS = stPT(tipoMer);
var tit = ‘’;
if (esMp) tit = (OP.operacion === ‘ingreso’ ? ‘Ingreso’ : ‘Egreso’) + ’ MP ’ + (esFrio ? ‘Fria’ : ‘Seca’);
else if (esPt) tit = (OP.operacion === ‘ingreso’ ? ‘Ingreso’ : ‘Egreso’) + ’ PT ’ + (esFrio ? ‘Frio’ : ‘Seco’);
else tit = (OP.operacion === ‘ingreso’ ? ‘Ingreso’ : ‘Egreso’) + ’ - ’ + OP.clienteNom;
stit(tit);

var html = ‘<div class="card"><div style="font-size:16px;font-weight:700;margin-bottom:16px">’ + tit + ‘</div>’;

if (esMp && OP.operacion === ‘ingreso’) {
html += ‘<div class="g2"><div class="fg"><label>Orden de compra *</label><input id="f-oc" placeholder="OC-001"></div>’ +
‘<div class="fg"><label>Fecha *</label><input id="f-fi" type="date" value="' + hoy() + '"></div></div>’ +
‘<div class="fg"><label>Producto *</label><input id="f-prod" placeholder="Ej: Harina de trigo" oninput="syncProd(this.value)"></div>’ +
‘<div class="fg"><label>Lotes *</label>’ +
‘<div style="background:#F8F8F6;border-radius:8px;padding:10px;border:1px solid #eee">’ +
‘<div id="lotes-cont"></div>’ +
‘<button class="btn" style="width:100%;margin-top:6px;border-style:dashed;font-size:12px" onclick="addLote()">+ Agregar lote</button>’ +
‘</div></div>’ +
‘<div class="g2"><div class="fg"><label>Zona</label><select id="f-zona"><option value="">Sin asignar</option><option value="almacenaje">Almacenaje</option><option value="armado">Armado de pedidos</option></select></div>’ +
‘<div class="fg"><label>Fila</label><input id="f-fila" placeholder="Ej: F3, A1"></div></div>’;
lotesOP = [{nom:’’,cod:’’}];
}
else if (esMp && OP.operacion === ‘egreso’) {
var ocs = [];
for (var i = 0; i < D.mp.length; i++) {
var r = D.mp[i];
if (r.tipo === tipoMer && !r.fe) {
var found = false;
for (var j = 0; j < ocs.length; j++) { if (ocs[j] === r.oc) { found = true; break; } }
if (!found) ocs.push(r.oc);
}
}
ocs.sort();
var opts = ‘<option value="">Elige una OC</option>’;
for (var k = 0; k < ocs.length; k++) opts += ‘<option value="' + ocs[k] + '">OC: ’ + ocs[k] + ‘</option>’;
html += ‘<div class="fg"><label>Orden de compra *</label><select id="f-oc-eg" onchange="cargarLotes(\'' + tipoMer + '\')">’ + opts + ‘</select></div>’ +
‘<div id="lotes-eg-wrap" style="display:none;margin-bottom:14px">’ +
‘<label style="font-size:12px;color:#666;font-weight:600;display:block;margin-bottom:8px">Lotes a egresar *</label>’ +
‘<div id="lotes-eg-list" style="background:#F8F8F6;border-radius:8px;padding:10px;border:1px solid #eee"></div></div>’ +
‘<div class="fg"><label>Fecha de egreso *</label><input id="f-fe" type="date" value="' + hoy() + '"></div>’;
lotesSelOP = [];
}
else if (esPt && OP.operacion === ‘ingreso’) {
html += ‘<div class="infobox"><b>Tipo:</b> ’ + (esFrio ? ‘Frio’ : ‘Seco’) + ’  |  <b>Stock actual:</b> <span style="color:#185FA5;font-weight:700">’ + stS + ’ posiciones</span></div>’ +
‘<div class="g2"><div class="fg"><label>Remito *</label><input id="f-rem" placeholder="REM-001"></div>’ +
‘<div class="fg"><label>Fecha *</label><input id="f-fi" type="date" value="' + hoy() + '"></div></div>’ +
‘<div class="fg"><label>Transporte</label><input id="f-tra" placeholder="Transporte..."></div>’ +
‘<div class="fg"><label>Posiciones *</label><input id="f-pal" type="number" min="1" placeholder="0"></div>’ +
‘<div class="g2"><div class="fg"><label>Zona</label><select id="f-zona"><option value="">Sin asignar</option><option value="almacenaje">Almacenaje</option><option value="armado">Armado de pedidos</option></select></div>’ +
‘<div class="fg"><label>Fila</label><input id="f-fila" placeholder="Ej: F3, A1"></div></div>’;

function calcMPtot(tipo) {
var mes = mes0();
var parts = mes.split(’-’);
var y = parseInt(parts[0]);
var m = parseInt(parts[1]);
var im = new Date(y, m-1, 1);
var fm = new Date(y, m, 0);
var hD = new Date(hoy());
var tar = tipo === ‘seco’ ? D.tar.mps : D.tar.mpf;
var tmi = D.tar.mi || 0;
var tme = D.tar.me || 0;
var tot = 0;
var list2 = D.mp || [];
for (var i = 0; i < list2.length; i++) {
var r = list2[i];
if (r.tipo !== tipo) continue;
var rfi = new Date(r.fi);
var rfe = r.fe ? new Date(r.fe) : null;
if (rfi > fm) continue;
if (rfe && rfe < im) continue;
var de = rfi > im ? rfi : im;
var ha = rfe ? (rfe < hD ? rfe : hD) : hD;
if (de <= ha) {
var dias = Math.ceil((ha - de) / 86400000) + 1;
tot += dias * (tar || 0);
}
tot += tmi;
if (r.fe && rfe >= im && rfe <= fm) tot += tme;
}
return tot;
}

function calcPT() {
var mes = mes0();
var parts = mes.split(’-’);
var y = parseInt(parts[0]);
var m = parseInt(parts[1]);
var diasMes = new Date(y, m, 0).getDate();
var hoyDate = new Date();
var tot = 0;
for (var d = 1; d <= diasMes; d++) {
var fd = y + ‘-’ + String(m).padStart(2,‘0’) + ‘-’ + String(d).padStart(2,‘0’);
var dD = new Date(fd);
if (dD > hoyDate) break;
var stS2 = 0, stF2 = 0;
for (var i = 0; i < D.pt.length; i++) {
var mv = D.pt[i];
if (new Date(mv.fecha) <= dD) {
var delta = mv.dir === ‘in’ ? mv.pal : -mv.pal;
if (mv.tipo === ‘seco’) stS2 += delta;
else stF2 += delta;
}
}
tot += Math.max(0, stS2) * (D.tar.pts || 0);
tot += Math.max(0, stF2) * (D.tar.ptf || 0);
for (var j = 0; j < D.pt.length; j++) {
if (D.pt[j].fecha === fd) tot += D.pt[j].pal * (D.tar.mi || 0);
}
}
return tot;
}

function calcCam() {
var pref = mes0();
var cam = D.tar.cam || 0;
var cnt = 0;
for (var i = 0; i < D.pt.length; i++) {
var mv = D.pt[i];
if (mv.dir === ‘out’ && mv.fecha && mv.fecha.indexOf(pref) === 0) cnt++;
}
return {cnt: cnt, tot: cnt * cam};
}

function calcCliTot() {
var mes = mes0();
var parts = mes.split(’-’);
var y = parseInt(parts[0]);
var m = parseInt(parts[1]);
var diasMes = new Date(y, m, 0).getDate();
var hoyDate = new Date();
var pref = mes;
var tot = 0;
for (var ci = 0; ci < D.clientes.length; ci++) {
var cli = D.clientes[ci];
for (var d = 1; d <= diasMes; d++) {
var fd = y + ‘-’ + String(m).padStart(2,‘0’) + ‘-’ + String(d).padStart(2,‘0’);
var dD = new Date(fd);
if (dD > hoyDate) break;
var st = 0;
for (var i = 0; i < D.movCli.length; i++) {
var mv2 = D.movCli[i];
if (mv2.clienteId === cli._id && new Date(mv2.fecha) <= dD) {
st += mv2.dir === ‘in’ ? mv2.pal : -mv2.pal;
}
}
tot += Math.max(0, st) * (cli.tarEst || 0);
}
for (var j = 0; j < D.movCli.length; j++) {
var mv3 = D.movCli[j];
if (mv3.clienteId === cli._id && mv3.fecha && mv3.fecha.indexOf(pref) === 0) {
tot += mv3.pal * (mv3.dir === ‘in’ ? (cli.tarMI || 0) : (cli.tarME || 0));
}
}
}
return tot;
}

var oc2 = ocKeys[oi];
var lotes2 = ocMap[oc2];
rows += ‘<tr><td class="plaoc" colspan="' + (diasCab.length + 2) + '">OC: ’ + oc2 + ’ - ’ + lotes2.length + ’ lote(s)</td></tr>’;
for (var li = 0; li < lotes2.length; li++) {
var r2 = lotes2[li];
var celdas = ‘’;
for (var cd = 0; cd < diasCab.length; cd++) {
var fdX = diasCab[cd];
var diaX = new Date(fdX);
var fiX = new Date(r2.fi);
var feX = r2.fe ? new Date(r2.fe) : null;
if (diaX < fiX) celdas += ‘<td class="celn">-</td>’;
else if (fdX === r2.fe) celdas += ‘<td class="celeg">↩</td>’;
else if (feX && diaX > feX) celdas += ‘<td class="celn">-</td>’;
else celdas += ‘<td class="celok">✓</td>’;
}
rows += ‘<tr><td class="plalote"><b>’ + r2.nom + ‘</b><br><span style="font-size:10px;color:#888">[’ + (r2.cod||’-’) + ‘] ’ + (r2.tipo===‘frio’?‘Frio’:‘Seco’) + ‘</span></td>’ + celdas + ‘<td style="font-size:11px;color:#888">’ + (r2.operario||’-’) + ‘</td></tr>’;
}
}

return ’<div class="card"><div class="tit">Planilla de lotes por dia - ’ + mes + ‘</div>’ +
‘<div style="font-size:12px;color:#888;margin-bottom:8px">Verde: activo | Rojo: egreso | Gris: no estaba</div>’ +
‘<div class="pla"><table class="platbl">’ +
‘<thead><tr><th class="plalote">Lote</th>’ + thDias + ‘<th style="min-width:80px">Operario</th></tr></thead>’ +
‘<tbody>’ + rows + ‘</tbody></table></div></div>’;
}

// ===== TARIFAS =====
function htmlTar() {
var t = D.tar;
var cliHtml = ‘’;
for (var i = 0; i < D.clientes.length; i++) {
var c = D.clientes[i];
cliHtml += ‘<div class="mcard">’ +
‘<div style="font-weight:700;font-size:13px">’ + c.nom + ‘</div>’ +
(c.desc ? ‘<div style="font-size:12px;color:#888">’ + c.desc + ‘</div>’ : ‘’) +
‘<div style="font-size:11px;color:#888;margin:4px 0 8px">Est: $’ + (c.tarEst||0) + ‘/pos/dia - Mov in: $’ + (c.tarMI||0) + ’ - Mov out: $’ + (c.tarME||0) + ‘</div>’ +
‘<div style="display:flex;gap:8px">’ +
‘<button class="btn" style="font-size:12px;padding:6px 12px" onclick="editCli(\'' + c._id + '\')">Editar</button>’ +
‘<button class="btn btnr" style="font-size:12px;padding:6px 12px" onclick="elimCli(\'' + c._id + '\')">Eliminar</button>’ +
‘</div></div>’;
}

return ‘<div class="card"><div class="tit">Estadias Arcor - tarifa diaria ($)</div>’ +
‘<div class="g2">’ +
‘<div class="fg"><label>MP Seca / lote</label><input id="t-mps" type="number" value="' + (t.mps||'') + '" placeholder="0.00"></div>’ +
‘<div class="fg"><label>MP Fria / lote</label><input id="t-mpf" type="number" value="' + (t.mpf||'') + '" placeholder="0.00"></div>’ +
‘<div class="fg"><label>PT Seco / posicion</label><input id="t-pts" type="number" value="' + (t.pts||'') + '" placeholder="0.00"></div>’ +
‘<div class="fg"><label>PT Frio / posicion</label><input id="t-ptf" type="number" value="' + (t.ptf||'') + '" placeholder="0.00"></div>’ +
‘</div></div>’ +
‘<div class="card"><div class="tit">Movimientos Arcor ($)</div>’ +
‘<div class="g2">’ +
‘<div class="fg"><label>Ingreso / posicion</label><input id="t-mi" type="number" value="' + (t.mi||'') + '" placeholder="0.00"></div>’ +
‘<div class="fg"><label>Egreso / posicion</label><input id="t-me" type="number" value="' + (t.me||'') + '" placeholder="0.00"></div>’ +
‘</div></div>’ +
‘<div class="card"><div class="tit">Tarifa por camion PT</div>’ +
‘<div class="fg"><label>Por camion cargado</label><input id="t-cam" type="number" value="' + (t.cam||'') + '" placeholder="0.00"></div></div>’ +
‘<div class="card"><div class="tit">PIN de administrador</div>’ +
‘<div class="fg"><label>Nuevo PIN (vacio = no cambia)</label><input id="t-pin" type="password" inputmode="numeric" maxlength="6" placeholder="****"></div></div>’ +
‘<button class="btn btnp" style="width:100%;padding:14px;font-size:16px;font-weight:700;margin-bottom:8px" onclick="guardarTar()">Guardar tarifas Arcor</button>’ +
‘<div id="tar-ok" style="color:#2E7D32;text-align:center;margin-bottom:16px;display:none;font-weight:600">Guardado</div>’ +
‘<div class="card"><div class="tit">Clientes</div>’ + (cliHtml || ‘<div class="empty">Sin clientes</div>’) + ‘</div>’ +
‘<div class="card" style="background:#EEF4FF;border-color:#B5D4F4">’ +
‘<div id="cli-tit" style="font-size:12px;font-weight:700;color:#185FA5;margin-bottom:12px">Nuevo cliente</div>’ +
‘<input type="hidden" id="cli-eid">’ +
‘<div class="g2">’ +
‘<div class="fg"><label>Nombre *</label><input id="cli-nom" placeholder="Ej: Netafim"></div>’ +
‘<div class="fg"><label>Descripcion</label><input id="cli-desc" placeholder="Ej: Mangueras"></div>’ +
‘</div>’ +
‘<div style="font-size:11px;font-weight:700;color:#666;text-transform:uppercase;margin-bottom:10px">Tarifas ($)</div>’ +
‘<div class="g2">’ +
‘<div class="fg"><label>Estadia / pos / dia</label><input id="cli-est" type="number" placeholder="0.00"></div>’ +
‘<div class="fg"><label>Mov. ingreso / pos</label><input id="cli-mi2" type="number" placeholder="0.00"></div>’ +
‘</div>’ +
‘<div class="fg"><label>Mov. egreso / pos</label><input id="cli-me2" type="number" placeholder="0.00"></div>’ +
‘<div style="display:flex;gap:8px">’ +
‘<button class="btn btnp" style="flex:1;padding:12px;font-size:14px;font-weight:600" onclick="guardarCli()">Guardar cliente</button>’ +
‘<button class="btn" id="cli-cancel" style="padding:12px;font-size:14px;display:none" onclick="cancelCli()">Cancelar</button>’ +
‘</div></div>’;
}

function guardarTar() {
var pin = gv(‘t-pin’);
D.tar = {
mps: parseFloat(gv(‘t-mps’)) || 0,
mpf: parseFloat(gv(‘t-mpf’)) || 0,
pts: parseFloat(gv(‘t-pts’)) || 0,
ptf: parseFloat(gv(‘t-ptf’)) || 0,
mi: parseFloat(gv(‘t-mi’)) || 0,
me: parseFloat(gv(‘t-me’)) || 0,
cam: parseFloat(gv(‘t-cam’)) || 0,
pin: (pin && pin.length >= 4) ? pin : (D.tar.pin || ‘1234’)
};
sv();
var ok = el(‘tar-ok’);
if (ok) { ok.style.display = ‘block’; setTimeout(function() { ok.style.display = ‘none’; }, 2500); }
}

function guardarCli() {
var nom = gv(‘cli-nom’).trim();
if (!nom) { alert(‘Ingresa el nombre’); return; }
var eid = gv(‘cli-eid’);
var obj = {
nom: nom,
desc: gv(‘cli-desc’).trim(),
tarEst: parseFloat(gv(‘cli-est’)) || 0,
tarMI: parseFloat(gv(‘cli-mi2’)) || 0,
tarME: parseFloat(gv(‘cli-me2’)) || 0
};
if (eid) {
for (var i = 0; i < D.clientes.length; i++) {
if (D.clientes[i]._id === eid) { D.clientes[i] = Object.assign({}, D.clientes[i], obj); break; }
}
} else {
obj._id = uid();
D.clientes.push(obj);
}
sv(); renderTab();
}

function editCli(id) {
var c = null;
for (var i = 0; i < D.clientes.length; i++) { if (D.clientes[i]._id === id) { c = D.clientes[i]; break; } }
if (!c) return;
sv2(‘cli-eid’, id); sv2(‘cli-nom’, c.nom); sv2(‘cli-desc’, c.desc || ‘’);
sv2(‘cli-est’, c.tarEst || ‘’); sv2(‘cli-mi2’, c.tarMI || ‘’); sv2(‘cli-me2’, c.tarME || ‘’);
if (el(‘cli-tit’)) el(‘cli-tit’).textContent = ‘Editar cliente’;
if (el(‘cli-cancel’)) el(‘cli-cancel’).style.display = ‘’;
if (el(‘cli-nom’)) el(‘cli-nom’).scrollIntoView({behavior:‘smooth’});
}

function cancelCli() {
sv2(‘cli-eid’,’’); sv2(‘cli-nom’,’’); sv2(‘cli-desc’,’’);
sv2(‘cli-est’,’’); sv2(‘cli-mi2’,’’); sv2(‘cli-me2’,’’);
if (el(‘cli-tit’)) el(‘cli-tit’).textContent = ‘Nuevo cliente’;
if (el(‘cli-cancel’)) el(‘cli-cancel’).style.display = ‘none’;
}

function elimCli(id) {
if (!confirm(‘Eliminar este cliente?’)) return;
D.clientes = D.clientes.filter(function(x) { return x._id !== id; });
sv(); renderTab();
}

// ===== ARRANCAR =====
if(document.readyState===‘loading’){document.addEventListener(‘DOMContentLoaded’,render);}else{render();}
</script>

</body>
</html>
