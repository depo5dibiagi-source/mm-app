<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#F4F4F0;min-height:100vh;font-size:14px}
input,select,button{font-family:inherit;font-size:14px}
input,select{width:100%;padding:11px 13px;border:1.5px solid #ddd;border-radius:8px;color:#111;background:#fff;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:#185FA5}
.btn{display:inline-block;padding:11px 18px;border-radius:9px;border:1.5px solid #ddd;background:#fff;color:#333;cursor:pointer;font-weight:500;text-align:center}
.btnp{background:#185FA5;color:#fff;border-color:#185FA5}
.btnr{background:#fff;color:#c62828;border-color:#ffcdd2}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:11px;padding:15px 16px;margin-bottom:12px}
.card-tit{font-size:13px;font-weight:600;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;color:#666;margin-bottom:4px;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.op-btn{padding:20px 12px;border-radius:12px;border:2px solid #e0e0e0;background:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center;width:100%}
.op-btn:active{border-color:#185FA5;background:#F0F4F9}
.hdr{background:#185FA5;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.hdr-tit{color:#fff;font-size:15px;font-weight:600;flex:1}
.back-btn{width:34px;height:34px;border-radius:8px;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:17px;cursor:pointer}
.body{padding:18px;max-width:500px;margin:0 auto}
.pregunta{font-size:18px;font-weight:700;margin-bottom:6px}
.sub-preg{font-size:13px;color:#888;margin-bottom:20px}
.rr{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #eee}
.rr:last-child{border-bottom:none}
.rr.grand{font-weight:700;font-size:15px;border-top:2px solid #ddd;border-bottom:none;padding-top:10px;margin-top:4px}
.nav-bar{display:flex;gap:4px;padding:8px 16px;background:#fff;border-bottom:1px solid #e5e5e5;overflow-x:auto}
.nav-tab{padding:6px 13px;border-radius:7px;border:1px solid #ddd;background:transparent;color:#555;font-size:12px;cursor:pointer;white-space:nowrap}
.nav-tab.on{background:#185FA5;color:#fff;border-color:#185FA5}
.firma{position:fixed;bottom:12px;right:16px;font-size:13px;color:#185FA5;z-index:9999;pointer-events:none;font-style:italic;font-weight:600;background:rgba(255,255,255,.9);padding:4px 10px;border-radius:20px}
.met-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.met{background:#F8F8F6;border-radius:8px;padding:12px 14px;border:1px solid #eee}
.chip{padding:6px 14px;border-radius:20px;border:2px solid #ddd;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#555}
.chip.on{border-color:#185FA5;background:#E6F1FB;color:#185FA5}
.lote-row{display:grid;grid-template-columns:1fr 1fr auto auto;gap:6px;margin-bottom:8px;align-items:center}
.lote-inp{padding:8px 10px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;width:100%}
.cam-btn{display:flex;align-items:center;justify-content:center;width:36px;height:38px;border:1.5px solid #185FA5;border-radius:6px;background:#E6F1FB;cursor:pointer;flex-shrink:0;font-size:18px}
.del-btn{width:32px;height:38px;border:1px solid #ffcdd2;background:#fff;color:#c62828;border-radius:6px;cursor:pointer;flex-shrink:0;font-size:14px}
.info-box{background:#F0F4F9;border:1px solid #B5D4F4;border-radius:8px;padding:10px 13px;margin-bottom:14px;font-size:13px;line-height:1.7}
.err-box{background:#FFEBEE;color:#c62828;border-radius:7px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.lote-card{background:#F8F8F6;border-radius:8px;padding:12px 14px;margin-bottom:10px;border:1px solid #eee}
.mov-card{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;margin-bottom:6px}
.mov-in{background:#E8F5E9}
.mov-out{background:#FFEBEE}
.adm-hdr{background:#fff;border-bottom:1px solid #e5e5e5;padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.empty{text-align:center;padding:24px;color:#bbb;font-size:13px}
.planilla-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.planilla-table{border-collapse:collapse;font-size:11px;min-width:600px}
.planilla-table th,.planilla-table td{border:1px solid #e0e0e0;padding:4px 6px;white-space:nowrap}
.planilla-table th{background:#F0F4F9;font-weight:600;color:#555;text-align:center}
.planilla-table .lote-cel{background:#fff;text-align:left;min-width:120px;position:sticky;left:0;z-index:2;border-right:2px solid #B5D4F4}
.planilla-table .oc-hdr{background:#185FA5;color:#fff;font-weight:700;text-align:left}
.cel-ok{background:#C8E6C9;text-align:center;color:#2E7D32;font-weight:700}
.cel-no{background:#F5F5F5;text-align:center;color:#ddd}
.cel-eg{background:#FFCDD2;text-align:center;color:#C62828;font-weight:700}
.indicador-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.ind-card{background:#fff;border-radius:10px;padding:14px;border:1px solid #e5e5e5;text-align:center}
.ind-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
.ind-val{font-size:22px;font-weight:700;margin-bottom:4px}
.ind-bar-bg{background:#eee;border-radius:99px;height:8px;margin:6px 0 4px}
.ind-bar{height:8px;border-radius:99px;transition:.3s}
.ind-sub{font-size:11px;color:#888}
</style>
</head>
<body>
<div class="firma">© Marcos Manchón</div>
<div id="app"></div>
<script>
const K='mm_dep_v3';
function base(){return{tar:{mps:0,mpf:0,pts:0,ptf:0,mi:0,me:0,cam:0,pin:'1234'},mp:[],pt:[],clientes:[],movCli:[]};}
let D=(()=>{try{var s=localStorage.getItem(K);return s?JSON.parse(s):base();}catch(e){return base();}})();
function sv(){try{localStorage.setItem(K,JSON.stringify(D));}catch(e){}}
function uid(){return Date.now()+Math.random().toString(36).slice(2);}
function hoy(){return new Date().toISOString().slice(0,10);}
function mes0(){return new Date().toISOString().slice(0,7);}
function $c(n){return '$'+parseFloat(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function el(id){return document.getElementById(id);}
function val(id){return el(id)?el(id).value:'';}
function inp(id,v){if(el(id))el(id).value=v;}

function stPT(tipo){
var hD=new Date(hoy());
var tot=0;
(D.pt||[]).forEach(function(mv){if(mv.tipo===tipo&&new Date(mv.fecha)<=hD)tot+=mv.dir===‘in’?mv.pal:-mv.pal;});
return Math.max(0,tot);
}
function stCli(cid){
return Math.max(0,(D.movCli||[]).filter(m=>m.clienteId===cid).reduce((s,m)=>s+(m.dir===‘in’?m.pal:-m.pal),0));
}

let pantalla=‘inicio’;
function ir(p){pantalla=p;render();}

function render(){
try{
const app=el(‘app’);
if(!app){console.error(‘No se encontró #app’);return;}
if(pantalla===‘inicio’) app.innerHTML=htmlInicio();
else if(pantalla===‘pin’) app.innerHTML=htmlPin();
else if(pantalla===‘operario’) renderOperario();
else if(pantalla===‘admin’) renderAdmin();
}catch(e){
const app=el(‘app’);
if(app) app.innerHTML=’<div style="padding:30px;color:red;font-size:14px"><strong>Error:</strong> ‘+e.message+’<br><small>’+e.stack+’</small></div>’;
console.error(e);
}
}

// ── INICIO ───────────────────────────────────────────────────────────────────
function htmlInicio(){
return `<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:20px;background:#F4F4F0">

<div style="width:64px;height:64px;background:#185FA5;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700">MM</div>
<div style="text-align:center"><div style="font-size:22px;font-weight:700">MM</div><div style="font-size:13px;color:#888;margin-top:4px">¿Cómo vas a usar la app hoy?</div></div>
<button onclick="ir('operario')" style="width:100%;max-width:340px;padding:18px;border-radius:12px;border:2px solid #e0e0e0;background:#fff;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left">
<div style="width:44px;height:44px;border-radius:10px;background:#E6F1FB;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">👷</div>
<div><div style="font-size:16px;font-weight:700">Operario</div><div style="font-size:12px;color:#888;margin-top:2px">Registrar ingresos y egresos</div></div>
</button>
<button onclick="ir('pin')" style="width:100%;max-width:340px;padding:18px;border-radius:12px;border:2px solid #e0e0e0;background:#fff;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left">
<div style="width:44px;height:44px;border-radius:10px;background:#E8F5E9;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">📊</div>
<div><div style="font-size:16px;font-weight:700">Administrador</div><div style="font-size:12px;color:#888;margin-top:2px">Ver reportes, stock y tarifas</div></div>
</button></div>`;
}

// ── PIN ──────────────────────────────────────────────────────────────────────
function htmlPin(){
return `<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#F4F4F0">

<div style="font-size:48px">🔐</div>
<div style="font-size:18px;font-weight:700">Acceso Administrador</div>
<div style="font-size:13px;color:#888">Ingresá tu PIN</div>
<input id="pin-inp" type="password" inputmode="numeric" maxlength="6" placeholder="••••" oninput="chkPin(this.value)"
style="font-size:28px;letter-spacing:12px;text-align:center;width:180px;padding:12px;border:2px solid #ddd;border-radius:10px;outline:none;-webkit-appearance:none">
<div id="pin-err" style="color:#c62828;font-size:13px;display:none">PIN incorrecto</div>
<span onclick="ir('inicio')" style="font-size:13px;color:#888;cursor:pointer;text-decoration:underline">← Volver</span></div>`;
}
function chkPin(v){
if(v.length>=4&&v===String(D.tar.pin||'1234')){ir('admin');}
else if(v.length>=4){el('pin-err').style.display='block';el('pin-inp').value='';}
}

// ── OPERARIO ─────────────────────────────────────────────────────────────────
let OP={paso:0,cliente:‘arcor’,clienteNom:‘Arcor’,operacion:null,mercaderia:null,tipo:null};
let lotesOP=[{nom:’’,cod:’’}];
let lotesSelOP=[];

function resetOP(){OP={paso:0,cliente:‘arcor’,clienteNom:‘Arcor’,operacion:null,mercaderia:null,tipo:null};lotesOP=[{nom:’’,cod:’’}];lotesSelOP=[];}

function renderOperario(){
el(‘app’).innerHTML=`<div style="min-height:100vh;background:#F4F4F0;display:flex;flex-direction:column"> <div class="hdr"> <button class="back-btn" onclick="opVolver()">←</button> <div class="hdr-tit" id="op-tit">Nueva operación</div> ${OP.paso>0?`<div style="color:rgba(255,255,255,.7);font-size:12px">Paso ${OP.paso}</div>`:’’}
</div>
<div class="body" id="op-body"></div>

</div>`;
renderOpPaso();
}

function opVolver(){
if(OP.paso===0){ir(‘inicio’);return;}
OP.paso–;
if(OP.paso===0){OP.operacion=null;OP.mercaderia=null;OP.tipo=null;}
else if(OP.paso===1){OP.mercaderia=null;OP.tipo=null;}
else if(OP.paso===2){OP.tipo=null;}
renderOpPaso();
}

function setOpTit(t){if(el(‘op-tit’))el(‘op-tit’).textContent=t;}

function renderOpPaso(){
const b=el(‘op-body’);
if(OP.paso===0){
setOpTit(‘Nueva operación’);
const chips=[{id:‘arcor’,nom:‘Arcor’,ico:‘🌽’},…(D.clientes||[]).map(c=>({id:c._id,nom:c.nom,ico:‘🏭’}))];
b.innerHTML=` <div class="fg" style="margin-bottom:20px"> <label>¿Quién realiza la operación? *</label> <input id="op-operario" placeholder="Tu nombre o legajo" value="${OP.operario||''}"> </div> <div class="pregunta">¿Qué operación?</div> <div class="sub-preg">¿Entra o sale mercadería?</div> <div class="g2" style="margin-bottom:20px"> <button class="op-btn" onclick="opSelOp('ingreso')"><span style="font-size:36px">📥</span><span style="font-size:15px;font-weight:700">Ingreso</span><span style="font-size:12px;color:#888">Entra al depósito</span></button> <button class="op-btn" onclick="opSelOp('egreso')"><span style="font-size:36px">📤</span><span style="font-size:15px;font-weight:700">Egreso</span><span style="font-size:12px;color:#888">Sale del depósito</span></button> </div> ${D.clientes.length>0?`<div style="font-size:12px;color:#888;margin-bottom:8px;font-weight:500">CLIENTE</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">${chips.map(c=>`<button class="chip${OP.cliente===c.id?' on':''}" onclick="opSelCli('${c.id}','${c.nom.replace(/'/g,"\\'")}')">${c.ico} ${c.nom}</button>`).join(’’)}</div>`:''}`;
}
else if(OP.paso===1){
if(OP.cliente!==‘arcor’){OP.tipo=‘cli’;renderFormOP();return;}
setOpTit(’¿Qué mercadería?’);
b.innerHTML=` <div class="pregunta">¿Qué mercadería?</div> <div class="sub-preg">Seleccioná la categoría</div> <div class="g2"> <button class="op-btn" onclick="opSelMer('mp')"><span style="font-size:36px">📦</span><span style="font-size:15px;font-weight:700">Materia Prima</span><span style="font-size:12px;color:#888">Seca o Fría</span></button> <button class="op-btn" onclick="opSelMer('pt')"><span style="font-size:36px">📬</span><span style="font-size:15px;font-weight:700">Prod. Terminado</span><span style="font-size:12px;color:#888">Seco o Frío</span></button> </div>`;
}
else if(OP.paso===2){
setOpTit(’¿Seco o Frío?’);
b.innerHTML=` <div class="pregunta">¿Seco o Frío?</div> <div class="sub-preg">Tipo de almacenaje</div> <div class="g2"> <button class="op-btn" onclick="opSelTipo('seco')"><span style="font-size:36px">☀️</span><span style="font-size:15px;font-weight:700">Seco</span></button> <button class="op-btn" onclick="opSelTipo('frio')"><span style="font-size:36px">❄️</span><span style="font-size:15px;font-weight:700">Frío</span></button> </div>`;
}
else if(OP.paso===3){renderFormOP();}
}

function opSelOp(op){
const nom=val(‘op-operario’).trim();
if(!nom){alert(‘Ingresá tu nombre antes de continuar’);el(‘op-operario’).focus();return;}
OP.operario=nom;OP.operacion=op;OP.paso=1;renderOpPaso();
}
function opSelCli(id,nom){OP.cliente=id;OP.clienteNom=nom;document.querySelectorAll(’.chip’).forEach(c=>c.classList.remove(‘on’));event.target.closest(’.chip’)&&event.target.closest(’.chip’).classList.add(‘on’);}
function opSelMer(m){OP.mercaderia=m;OP.paso=2;renderOpPaso();}
function opSelTipo(t){OP.tipo=OP.mercaderia+’-’+t;OP.paso=3;renderOpPaso();}

function renderFormOP(){
const b=el(‘op-body’);
const esMp=OP.tipo&&OP.tipo.startsWith(‘mp’);
const esPt=OP.tipo&&OP.tipo.startsWith(‘pt’);
const esCli=OP.cliente!==‘arcor’;
const esFrio=OP.tipo&&OP.tipo.includes(‘frio’);
const tipoMer=esFrio?‘frio’:‘seco’;
const stS=stPT(tipoMer);
const ocDisp=[…new Set((D.mp||[]).filter(r=>r.tipo===tipoMer&&!r.fe).map(r=>r.oc))].sort();
const tit=esMp?`${OP.operacion==='ingreso'?'Ingreso':'Egreso'} MP ${esFrio?'Fría':'Seca'}`:esPt?`${OP.operacion==='ingreso'?'Ingreso':'Egreso'} PT ${esFrio?'Frío':'Seco'}`:`${OP.operacion==='ingreso'?'Ingreso':'Egreso'} - ${OP.clienteNom}`;
setOpTit(tit);

let html=`<div style="background:#fff;border-radius:12px;border:1px solid #e5e5e5;padding:20px;margin-top:8px"> <div style="font-size:16px;font-weight:700;margin-bottom:16px">${tit}</div>`;

if(esMp&&OP.operacion===‘ingreso’){
html+=`<div class="g2"><div class="fg"><label>Orden de compra *</label><input id="f-oc" placeholder="OC-2025-001"></div> <div class="fg"><label>Fecha *</label><input id="f-fi" type="date" value="${hoy()}"></div></div> <div class="fg"><label>Producto *</label><input id="f-prod" placeholder="Ej: Harina de trigo" oninput="syncProd(this.value)"></div> <div class="fg"><label>Lotes *</label> <div style="background:#F8F8F6;border-radius:8px;padding:10px;border:1px solid #eee"> <div id="lotes-cont"></div> <button class="btn" style="width:100%;margin-top:6px;border-style:dashed;font-size:12px" onclick="addLoteOP()">+ Agregar lote</button> </div></div> <div class="fg"><label>Zona</label><select id="f-zona"><option value="">- Sin asignar -</option><option value="almacenaje">🏪 Almacenaje</option><option value="armado">📦 Armado de pedidos</option></select></div> <div class="fg"><label>Fila</label><input id="f-fila" placeholder="Ej: F3, A1..."></div>`;
lotesOP=[{nom:’’,cod:’’}];
}
else if(esMp&&OP.operacion===‘egreso’){
const opts=ocDisp.map(o=>`<option value="${o}">OC: ${o}</option>`).join(’’);
html+=`<div class="fg"><label>Orden de compra *</label> <select id="f-oc-eg" onchange="cargarLotesEg('${tipoMer}')"><option value="">- Elegí una OC -</option>${opts}</select></div> <div id="lotes-eg-wrap" style="display:none;margin-bottom:14px"> <label style="font-size:12px;color:#666;font-weight:500;display:block;margin-bottom:8px">Lotes a egresar *</label> <div id="lotes-eg-list" style="background:#F8F8F6;border-radius:8px;padding:10px;border:1px solid #eee"></div> </div> <div class="fg"><label>Fecha de egreso *</label><input id="f-fe" type="date" value="${hoy()}"></div>`;
lotesSelOP=[];
}
else if(esPt&&OP.operacion===‘ingreso’){
html+=`<div class="info-box"><strong>Tipo:</strong> ${esFrio?'❄️ Frío':'☀️ Seco'} &nbsp;|&nbsp; <strong>Stock actual:</strong> <span style="color:#185FA5;font-weight:700">${stS} posiciones</span></div> <div class="g2"><div class="fg"><label>Remito *</label><input id="f-rem" placeholder="REM-001"></div> <div class="fg"><label>Fecha *</label><input id="f-fi" type="date" value="${hoy()}"></div></div> <div class="fg"><label>Transporte</label><input id="f-tra" placeholder="Transporte..."></div> <div class="fg"><label>posiciones *</label><input id="f-pal" type="number" min="1" placeholder="0"></div> <div class="fg"><label>Zona</label><select id="f-zona"><option value="">- Sin asignar -</option><option value="almacenaje">🏪 Almacenaje</option><option value="armado">📦 Armado de pedidos</option></select></div> <div class="fg"><label>Fila</label><input id="f-fila" placeholder="Ej: F3, A1..."></div>`;
}
else if(esPt&&OP.operacion===‘egreso’){
html+=`<div class="info-box"><strong>Tipo:</strong> ${esFrio?'❄️ Frío':'☀️ Seco'} &nbsp;|&nbsp; <strong>Stock:</strong> <span style="color:#185FA5;font-weight:700">${stS} posiciones</span></div> <div class="g2"><div class="fg"><label>Fecha *</label><input id="f-fe" type="date" value="${hoy()}"></div> <div class="fg"><label>posiciones *</label><input id="f-pal" type="number" min="1" placeholder="0"></div></div> <div class="g2"><div class="fg"><label>Remito salida *</label><input id="f-rs" placeholder="RS-001"></div> <div class="fg"><label>Ord. entrega *</label><input id="f-oe" placeholder="OE-001"></div></div> <div class="g2"><div class="fg"><label>Ord. compra *</label><input id="f-oc" placeholder="OC-001"></div> <div class="fg"><label>Transporte</label><input id="f-tra" placeholder="Transporte..."></div></div>`;
}
else if(esCli){
const stC=stCli(OP.cliente);
html+=`${OP.operacion==='egreso'?`<div class="info-box"><strong>Stock actual:</strong> <span style="color:#185FA5;font-weight:700">${stC} posiciones</span></div>`:''} <div class="g2"><div class="fg"><label>Fecha *</label><input id="f-fecha" type="date" value="${hoy()}"></div> <div class="fg"><label>posiciones *</label><input id="f-pal" type="number" min="1" placeholder="0"></div></div> <div class="fg"><label>Descripción</label><input id="f-desc" placeholder="Ej: Mangueras 16mm"></div> <div class="fg"><label>Remito</label><input id="f-rem" placeholder="REM-001"></div> ${OP.operacion==='ingreso'?`<div class="fg"><label>Zona</label><select id="f-zona"><option value="">- Sin asignar -</option><option value="almacenaje">🏪 Almacenaje</option><option value="armado">📦 Armado de pedidos</option></select></div>
<div class="fg"><label>Fila</label><input id="f-fila" placeholder="Ej: F3, A1..."></div>`:''}`;
}

const d=await resp.json();

lotesOP[idx]={nom:parsed.lote||lotesOP[idx].nom,cod:parsed.codigo||lotesOP[idx].cod};

}

function calcResumen(){
const mes=mes0(),[y,m]=mes.split(’-’).map(Number);
const im=new Date(y,m-1,1),fm=new Date(y,m,0),hD=new Date(hoy());
const diasMes=new Date(y,m,0).getDate(),pref=mes;

function mpTot(tipo){
const tar=tipo===‘seco’?D.tar.mps:D.tar.mpf,tmi=D.tar.mi||0,tme=D.tar.me||0;
let t=0;
(D.mp||[]).filter(r=>r.tipo===tipo&&new Date(r.fi)<=fm&&(!r.fe||new Date(r.fe)>=im)).forEach(r=>{
const en=new Date(r.fi),sa=r.fe?new Date(r.fe):hD;
const de=en>im?en:im,ha=sa<hD?sa:hD;
t+=Math.max(0,Math.ceil((ha-de)/86400000)+1)*(tar||0)+tmi;
if(r.fe&&new Date(r.fe)>=im&&new Date(r.fe)<=fm)t+=tme;
});return t;
}

let ptTotal=0;
for(let d=1;d<=diasMes;d++){
const fd=y+’-’+String(m).padStart(2,‘0’)+’-’+String(d).padStart(2,‘0’);
const dD=new Date(fd);if(dD>new Date())break;
const stS=(D.pt||[]).filter(mv=>mv.tipo===‘seco’&&new Date(mv.fecha)<=dD).reduce((s,mv)=>s+(mv.dir===‘in’?mv.pal:-mv.pal),0);
const stF=(D.pt||[]).filter(mv=>mv.tipo===‘frio’&&new Date(mv.fecha)<=dD).reduce((s,mv)=>s+(mv.dir===‘in’?mv.pal:-mv.pal),0);
ptTotal+=Math.max(0,stS)*(D.tar.pts||0)+Math.max(0,stF)*(D.tar.ptf||0);
(D.pt||[]).filter(mv=>mv.fecha===fd).forEach(mv=>{ptTotal+=mv.pal*(D.tar.mi||0);});
}
const cams=(D.pt||[]).filter(mv=>mv.dir===‘out’&&mv.fecha&&mv.fecha.startsWith(pref));
const camTotal=cams.length*(D.tar.cam||0);
const arcorTotal=mpTot(‘seco’)+mpTot(‘frio’)+ptTotal+camTotal;

let cliTotal=0;
(D.clientes||[]).forEach(cli=>{
for(let d=1;d<=diasMes;d++){
const fd=y+’-’+String(m).padStart(2,‘0’)+’-’+String(d).padStart(2,‘0’);
const dD=new Date(fd);if(dD>new Date())break;
const st=Math.max(0,(D.movCli||[]).filter(mv=>mv.clienteId===cli._id&&new Date(mv.fecha)<=dD).reduce((s,mv)=>s+(mv.dir===‘in’?mv.pal:-mv.pal),0));
cliTotal+=st*(cli.tarEst||0);
}
const movsM=(D.movCli||[]).filter(mv=>mv.clienteId===cli._id&&mv.fecha&&mv.fecha.startsWith(pref));
cliTotal+=movsM.filter(mv=>mv.dir===‘in’).reduce((s,mv)=>s+mv.pal,0)*(cli.tarMI||0);
cliTotal+=movsM.filter(mv=>mv.dir===‘out’).reduce((s,mv)=>s+mv.pal,0)*(cli.tarME||0);
});

return{mes,arcorTotal,cliTotal,gran:arcorTotal+cliTotal,cams,mpSeco:mpTot(‘seco’),mpFrio:mpTot(‘frio’),ptTotal,camTotal,
stS:stPT(‘seco’),stF:stPT(‘frio’),mpActivos:(D.mp||[]).filter(r=>!r.fe).length,pref};
}

return fi<=fm&&(!r.fe||new Date(r.fe)>=im);
});
const ocMap={};
regs.forEach(r=>{if(!ocMap[r.oc])ocMap[r.oc]=[];ocMap[r.oc].push(r);});
Object.keys(ocMap).forEach(oc=>ocMap[oc].sort((a,b)=>a.fi.localeCompare(b.fi)));

if(!Object.keys(ocMap).length) return ‘<div class="card"><div class="empty">Sin lotes de MP para este mes.</div></div>’;

// Cabecera de días - solo hasta hoy
const diasCab=diasArr.filter(fd=>fd<=hoy());
const thDias=diasCab.map(fd=>{
const d=parseInt(fd.slice(8));
return `<th style="min-width:30px;font-size:10px">${d}</th>`;
}).join(’’);

let html=`<div style="font-size:12px;color:#888;margin-bottom:10px">Mes: <strong>${mes}</strong> - Verde: activo, Rojo: egresó ese día, Gris: no estaba</div>

<div class="planilla-wrap">
<table class="planilla-table">
<thead><tr><th class="lote-cel">Lote</th>${thDias}<th style="min-width:80px">Operario</th></tr></thead>
<tbody>`;

Object.entries(ocMap).forEach(([oc,lotes])=>{
html+=`<tr><td class="oc-hdr" colspan="${diasCab.length+2}">OC: ${oc} - ${lotes.length} lote(s)</td></tr>`;
lotes.forEach(r=>{
const celdas=diasCab.map(fd=>{
const dia=new Date(fd);
const fi=new Date(r.fi);
const fe=r.fe?new Date(r.fe):null;
if(dia<fi) return ‘<td class="cel-no">-</td>’;
if(fe&&fd===r.fe) return ‘<td class="cel-eg">↩</td>’; // egresó ese día
if(fe&&dia>fe) return ‘<td class="cel-no">-</td>’;
return ‘<td class="cel-ok">✓</td>’;
}).join(’’);
html+=`<tr> <td class="lote-cel"><strong>${r.nom}</strong><br><span style="font-size:10px;color:#888">[${r.cod||'-'}] ${r.tipo==='frio'?'❄️':'☀️'}</span></td> ${celdas} <td style="font-size:11px;color:#888">${r.operario||'-'}</td> </tr>`;
});
});

html+=`</tbody></table></div>

<div style="margin-top:12px;display:flex;gap:16px;font-size:12px;color:#666;flex-wrap:wrap">
<span><span style="display:inline-block;width:14px;height:14px;background:#C8E6C9;border-radius:3px;margin-right:4px;vertical-align:middle"></span>Activo ese día</span>
<span><span style="display:inline-block;width:14px;height:14px;background:#FFCDD2;border-radius:3px;margin-right:4px;vertical-align:middle"></span>Egresó ese día</span>
<span><span style="display:inline-block;width:14px;height:14px;background:#F5F5F5;border:1px solid #eee;border-radius:3px;margin-right:4px;vertical-align:middle"></span>No estaba</span>
</div>`;

return `<div class="card"><div class="card-tit">📅 Seguimiento de lotes por día - ${mes}</div>${html}</div>`;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
if(document.readyState===‘loading’){
document.addEventListener(‘DOMContentLoaded’, render);
} else {
render();
}
</script>

</body>
</html>
